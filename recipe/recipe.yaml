context:
  version: "0.3.0"

package:
  name: kedro-skills
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/k/kedro-skills/kedro_skills-${{ version }}.tar.gz
  sha256: e87f9bbaf8fb6cbdccbc57fa183a639b30c597a5b698cc82ee81557d7d1dc472

build:
  number: 0
  script: ${{ PYTHON }} -m pip install .
  noarch: python

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }},<3.15
    - click >=8.0
    - kedro >=1.0
    - pyyaml >=6.0

tests:
  - python:
      imports:
        - kedro_skills
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - '*'

about:
  summary: Distribute AI coding skills to Kedro projects.
  homepage: https://github.com/kedro-org/kedro-skills
  license: Apache-2.0
  license_file:
    - LICENSE

extra:
  recipe-maintainers:
    - jsmolic
